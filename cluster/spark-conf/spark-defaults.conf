# Every job runs on the Hadoop YARN cluster and reads/writes HDFS.
spark.master                      yarn
spark.submit.deployMode           client
spark.driver.host                 spark-client
spark.driver.bindAddress          0.0.0.0
spark.driver.memory               2g
spark.yarn.am.memory              512m
spark.executor.instances          4
spark.executor.cores              2
spark.executor.memory             1536m
spark.executor.memoryOverhead     512m
spark.yarn.archive                hdfs://namenode:9000/spark/spark-jars.zip
spark.eventLog.enabled            true
spark.eventLog.dir                hdfs://namenode:9000/spark-logs
spark.history.fs.logDirectory     hdfs://namenode:9000/spark-logs
spark.sql.shuffle.partitions      64
spark.sql.adaptive.enabled        true
spark.serializer                  org.apache.spark.serializer.KryoSerializer
spark.hadoop.dfs.replication      3
spark.sql.sources.partitionColumnTypeInference.enabled false
